---
- name: Create deploy user
  user:
    name: deploy
    state: present
    shell: /bin/bash
    append: yes
    groups: sudo

- name: Sudo without password for deploy
  copy:
    dest: /etc/sudoers.d/deploy
    content: "deploy ALL=(ALL) NOPASSWD:ALL\n"
    validate: "visudo -cf %s"

- name: Ensure SSH directory exists
  file:
    path: "/home/deploy/.ssh"
    state: directory
    mode: '0700'
    owner: deploy
    group: deploy

- name: Install Nginx
  package:
    name: nginx
    state: present

- name: Deploy Nginx configuration
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/default
    owner: root
    group: root
    mode: '0644'
  notify: Restart Nginx

- name: Add Docker repo
  ansible.builtin.deb822_repository:
    name: docker-ce
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: amd64
    signed_by: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Install Docker
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Enable Docker
  service:
    name: docker
    state: started
    enabled: true

- name: Add deploy to docker group
  user:
    name: deploy
    groups: docker
    append: true
