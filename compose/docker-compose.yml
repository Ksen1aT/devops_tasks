services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - appnet

  app:
    image: nginx:1.25-alpine
    volumes:
      - ./html:/usr/share/nginx/html:ro
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
